name: Publish scheduled articles

on:
  schedule:
    - cron: '5 1 * * *'
  workflow_dispatch:
    inputs:
      build_time:
        description: Optional ISO time for a recovery build
        required: false
        type: string

concurrency:
  group: alankyeong-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLIC_SITE_ENV: production
      PUBLIC_BUILD_TIME: ${{ inputs.build_time }}
      PUBLIC_LINKEDIN_URL: https://www.linkedin.com/in/alankyeong
      PUBLIC_STRIPE_URL: https://buy.stripe.com/cNi9AS7lpf7fa188VqeAg00
      PUBLIC_AI_SITE_URL: https://ai.alankyeong.com/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:scheduled
      - run: pnpm build
      - name: Upload public files without deleting protected subdomains
        env:
          SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.HOSTINGER_SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.HOSTINGER_SFTP_PATH }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SFTP_PORT" "$SFTP_HOST" >> ~/.ssh/known_hosts
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" -e "set sftp:connect-program 'ssh -a -x -p $SFTP_PORT -o StrictHostKeyChecking=yes'; mirror --reverse --only-newer --parallel=4 --verbose dist/ '$SFTP_PATH'; bye" "sftp://$SFTP_HOST"
